name: Stage 10 Actual Cost Tracking

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stage10.py'
      - '.github/workflows/stage10.yml'

permissions:
  contents: write

concurrency:
  group: stage10-actual-cost-tracking
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply stage 10 changes
        run: python3 scripts/stage10.py
      - name: Fix embedded database compatible job lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/modules/manufacturing.ts')
          text = p.read_text()
          old = """      const [job] = await tx.query(
                `SELECT j.*,i.order_id
                   FROM relic.manufacturing_jobs j
                   JOIN relic.order_items i ON i.id=j.order_item_id
                  WHERE j.id=$1 FOR UPDATE`,
                [id],
              );
              ensure(job, 'Job de fabricação não encontrado.', 404);
              ensure(job.version === b.version, 'O job mudou. Atualize a página antes de salvar.', 409);
              ensure(
                !['COMPLETED', 'FAILED', 'CANCELLED'].includes(job.status),
                'Job encerrado não pode ser alterado.',
              );
              const [order] = await tx.query('SELECT status FROM relic.orders WHERE id=$1 FOR UPDATE', [
                job.order_id,
              ]);
          """
          new = """      const [job] = await tx.query(
                'SELECT * FROM relic.manufacturing_jobs WHERE id=$1 FOR UPDATE',
                [id],
              );
              ensure(job, 'Job de fabricação não encontrado.', 404);
              ensure(job.version === b.version, 'O job mudou. Atualize a página antes de salvar.', 409);
              ensure(
                !['COMPLETED', 'FAILED', 'CANCELLED'].includes(job.status),
                'Job encerrado não pode ser alterado.',
              );
              const [orderItem] = await tx.query('SELECT order_id FROM relic.order_items WHERE id=$1', [
                job.order_item_id,
              ]);
              ensure(orderItem, 'Item do pedido não encontrado.', 404);
              const [order] = await tx.query('SELECT status FROM relic.orders WHERE id=$1 FOR UPDATE', [
                orderItem.order_id,
              ]);
          """
          if old not in text:
              raise SystemExit('job lock pattern not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary stage files
        run: rm -f scripts/stage10.py .github/workflows/stage10.yml
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Verify typecheck tests and build
        run: npm run verify
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Commit validated upgrade
        run: |
          git config user.name 'Relic Studios Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: track actual production cost'
          git push origin HEAD:main
