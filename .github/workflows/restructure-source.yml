name: Restructure Relic source

on:
  push:
    branches:
      - restructure-source

permissions:
  contents: write

jobs:
  restructure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand application source
        shell: bash
        run: |
          set -euo pipefail
          test -f relic-studios-render.tgz
          work="$(mktemp -d)"
          tar -xzf relic-studios-render.tgz -C "$work"

          rm -rf backend frontend database package.json package-lock.json
          cp -a "$work"/. .
          rm -rf "$work" relic-studios-render.tgz

          cat > render.yaml <<'YAML'
          services:
            - type: web
              name: relic-studios-homolog
              runtime: node
              plan: free
              region: virginia
              buildCommand: npm ci --include=dev && npm run verify && npm audit --audit-level=high
              startCommand: node backend/dist/cli/migrate.js && node backend/dist/cli/bootstrap-render.js && node backend/dist/index.js
              healthCheckPath: /health
              envVars:
                - key: NODE_VERSION
                  value: 24.21.0
                - key: SKIP_INSTALL_DEPS
                  value: "true"
                - key: NODE_ENV
                  value: production
                - key: HOST
                  value: 0.0.0.0
                - key: COOKIE_SECURE
                  value: "true"
                - key: DB_MODE
                  value: postgres
                - key: MANAGED_DATABASE_SINGLE_USER
                  value: "true"
                - key: DATABASE_URL
                  fromDatabase:
                    name: relic-studios-homolog-db
                    property: connectionString
                - key: SESSION_SECRET
                  generateValue: true
                - key: BOOTSTRAP_ADMIN_NAME
                  sync: false
                - key: BOOTSTRAP_ADMIN_EMAIL
                  sync: false
                - key: BOOTSTRAP_ADMIN_PASSWORD
                  sync: false

          databases:
            - name: relic-studios-homolog-db
              plan: free
              region: virginia
              postgresMajorVersion: "18"
              databaseName: relic_studios
              user: relic_homolog
              ipAllowList: []
          YAML

          rm -rf .github

      - name: Commit canonical source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Relic Studios Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: expose application source tree" || exit 0
          git push origin HEAD:restructure-source
