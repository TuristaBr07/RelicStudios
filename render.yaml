services:
  - type: web
    name: relic-studios-homolog
    runtime: node
    plan: free
    region: virginia
    buildCommand: rm -rf app && mkdir app && tar -xzf relic-studios-render.tgz -C app && cd app && npm ci --include=dev && npm run verify && npm audit --audit-level=high
    startCommand: cd app && node backend/dist/cli/migrate.js && node backend/dist/cli/bootstrap-render.js && node backend/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: DB_MODE
        value: postgres
      - key: MANAGED_DATABASE_SINGLE_USER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: relic-studios-homolog-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: relic-studios-homolog-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    databaseName: relic_studios
    user: relic_homolog
    ipAllowList: []
